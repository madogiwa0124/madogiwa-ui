packages:
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

overrides:
  # NOTE: jest-runtime@30.5.0+ throws on `module.register()`, which Storybook's config loader calls
  # when @storybook/test-runner reads `.storybook/test-runner.ts`, so every story suite fails to run.
  # Keep jest-runtime below 30.5 until Storybook or the test-runner stops relying on it.
  jest-runtime: ~30.4.2

catalog:
  postcss-preset-env: ^11.6.1
  # NOTE: @microsoft/api-extractor pins its own bundled TypeScript (5.9.3), independent of this version.
  # unplugin-dts bundleTypes has been verified to work with TypeScript 6.0.x; if dist/types/index.d.ts
  # becomes empty after upgrading, check compatibility with api-extractor's bundled TypeScript.
  typescript: ~6.0.3
  vite: ^8.3.4
